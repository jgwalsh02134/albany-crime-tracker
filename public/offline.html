<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1128" />
    <title>Albany Pulse — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1128;
        --fg: #eef2ff;
        --muted: rgba(238, 242, 255, 0.75);
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.12);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(
            1200px 900px at 25% 0%,
            rgba(255, 255, 255, 0.08),
            transparent 60%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .card {
        width: min(520px, calc(100% - 2rem));
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 16px;
        padding: 20px 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
      }
      a {
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-label="Offline notice">
      <div class="row">
        <img src="/icon-192.png" alt="" />
        <div>
          <h1>You’re offline</h1>
          <p>
            Albany Pulse needs an internet connection to load the live incident feed, map, and
            scanner updates. Reconnect and try again.
          </p>
        </div>
      </div>
      <p>
        If you’re online but still seeing this screen, reload the app.
        <a href="/" rel="nofollow">Go to home</a>
      </p>
    </main>
  </body>
</html>
